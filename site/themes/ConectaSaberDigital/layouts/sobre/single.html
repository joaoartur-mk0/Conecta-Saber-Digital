<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ site.Params.description }}" />
  <link rel="icon" type="image/png" href="/img/iconConecta.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <title>{{ .Title }} - Conecta Saber Digital</title>
</head>

<body class="layout-documentacao">
  {{ partial "site-header.html" (dict "page" "sobre") }}

  <main class="sobre-page">
    <section class="sobre-hero">
      <span class="eyebrow">Conecta Saber Digital</span>
      <h1>Sobre o Projeto</h1>
    </section>

    <article class="corpo-aula sobre-conteudo">
      {{ .Content }}
    </article>
  </main>

  {{ partial "site-footer.html" . }}
</body>
</html>
